name: flake check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v19

      - name: Evaluate all configurations
        run: |
          nix eval .#nixosConfigurations.duck.config.system.build.toplevel.drvPath
          nix eval .#darwinConfigurations.duckbook-pro.system.drvPath
