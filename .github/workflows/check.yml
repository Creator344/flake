# Lint + evaluate, no builds. Evaluation proves the flake's options resolve;
# it cannot see build-time failures (a package patch that stops applying, a
# broken source). Those need a real `nix build` on a machine with the store.
name: Validate Nix Flake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.nix"
      - "**.lock"
      - "**.sh"
      - "statix.toml"
      - "justfile"
      - ".github/workflows/check.yml"
  pull_request:

permissions: {}

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nixfmt
            # globstar is off in bash, so ./**/*.nix silently matched only
            # ./global-modules/*.nix — 2 of 33 files. git ls-files is exact.
            run: nix run nixpkgs#nixfmt -- --check $(git ls-files '*.nix')
          - name: statix
            run: nix run nixpkgs#statix -- check .
          - name: deadnix
            run: nix run nixpkgs#deadnix -- --fail .
          - name: shellcheck
            # -r: nothing to check is a pass, not an xargs error.
            run: git ls-files -z '*.sh' | xargs -0 -r nix run nixpkgs#shellcheck --
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}

  eval:
    name: ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_attr: nixosConfigurations
            host: duck
          - target_attr: darwinConfigurations
            host: duckbook-pro
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate ${{ matrix.host }}
        run: |
          nix eval .#${{ matrix.target_attr }}.${{ matrix.host }}.config.system.build.toplevel.drvPath --show-trace
